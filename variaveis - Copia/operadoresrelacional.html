<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relacional</title>
</head>
<body>
    <script>
        let num1 = 35
        let num2 = 5

        igualdade = num1 == num2
        console.log(igualdade)

        console.log(5 == "5")
        console.log(true == 1)
        console.log(false == 0)
        console.log(null == undefined)
        
        let igualdadevalor = num1 === num2

        console.log(igualdadevalor)

        console.log(5 != "5")
        console.log(true != 1)

        console.log(5 !== "5")
        console.log(true !== 1)

        console.log(5>6)
        console.log(9>7)
        console.log(5>5)

        console.log(5<6)
        console.log(9<7)
        console.log(5<5)

        console.log(5>=6)
        console.log(9>=7)
        console.log(5>=5)

        console.log(5<=6)
        console.log(9<=7)
        console.log(5<=5)




    </script>
    
</body>
</html>
