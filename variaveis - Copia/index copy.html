<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>variaveis</title>
</head>
<body>
<script>
    //var e let
    //variaveis decalrada com var tem escopo globalou de função
    //podem ser atualizadas e declarada novamente dentro do seu escopo
    var nome="diego";
    console.log(nome);

    var nome = "maria";
    console.log(nome);

    nome = "romeu";
    console.log(nome)

    let idade= 34;
    console.log(idade);

    idade = 55;
    console.log(idade);

    //const
    //contantes o valor não pode ser modificado

    const CIDADE = "São Paulo";
    console.log(CIDADE);

    //CIDADE = "RIO DE JANEIRO"; VAI DAR ERRO

    let string = 'sou um texto';
    console.log(string);

    //boolean

    let maiorIdade =false;
    let menorIdade = true;

    console.log(maiorIdade)
    console.log(typeof maiorIdade)

    //NUMBER

    idade = 33;
    let preco = 25.90;

    console.log(typeof preco)



</script>
    
</body>
</html>
