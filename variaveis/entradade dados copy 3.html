<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>variaveis</title>
</head>

<body>


  <label for="">grau celcius </label>
  <input type="text" id ="num1">
 
  <button onclick=" farenheit()">calcular</button>

  <p id="resultado"></p>

  <script>
    function farenheit() {

       n1 = parseInt (document.getElementById('num1').value)

      let farenheit = (n1 * 9/5) + 32 ;

      let resultado = document.getElementById('resultado');
      resultado.innerText = farenheit
    }
  </script>
</body>

</html>
