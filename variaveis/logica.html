<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*operadores lógicos
        esses operadores são usados para conbinar expressões lógicas
        */

        /*operador lógico E (&&): retorna verdadeiro se ambas espressões forem
        */

        /*operadorlógico Ou (||): retorna verdadeiro se pelo menos uma das expressões forem*/

        nome = "diego"
        senha = "1234"

        resultado = nome == "diego" && senha =="1234"

        console.log(resultado)

    </script>
    
</body>
</html>
